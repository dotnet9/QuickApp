<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-style="glass" data-label="icon" data-search-open="true" data-edit="false" data-edge="top">
<head>
<meta charset="utf-8">
<title>原型 02 · 搜索</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="assets/proto.css">
</head>
<body class="dock-visible">

<div class="taskbar" aria-hidden="true">
  <i></i><i></i><i></i><span class="clock">原型演示 · 模拟桌面</span>
</div>

<a class="proto-back" href="index.html">← 原型目录</a>

<!-- 搜索态 Dock：面板恢复完整底板，顶部搜索行 + 分组结果 -->
<div class="dock" id="dock" role="toolbar" aria-label="快捷 Dock 搜索">
  <div class="dock-search">
    <span class="search-icon" data-icon="search"></span>
    <input id="searchInput" type="search" placeholder="搜索应用 / 网址 / 命令 / 拼音…" aria-label="搜索" autocomplete="off" value="微">
    <span class="search-count" id="searchCount">0 个结果</span>
    <button class="icon-btn" id="searchClose" data-icon="x" title="关闭搜索" aria-label="关闭搜索"></button>
  </div>

  <div class="dock-body">
    <div class="items-wrap">
      <div class="dock-items searching" id="dockItems" role="list"></div>
      <div class="fade fade-left" id="fadeLeft"></div>
      <div class="fade fade-right" id="fadeRight"></div>
      <div class="scroll-indicator" id="scrollIndicator" hidden><i id="scrollThumb"></i></div>
    </div>
    <div class="dock-tools">
      <div class="dock-divider"></div>
      <div class="dock-actions">
        <button class="icon-btn active" id="btnSearch" data-icon="search" title="搜索（S）" aria-label="搜索"></button>
        <button class="icon-btn" id="btnPin" data-icon="pin" title="钉住 Dock" aria-label="钉住 Dock" aria-pressed="false"></button>
        <button class="icon-btn" id="btnMenu" data-icon="more" title="更多操作" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false"></button>
        <button class="icon-btn low-priority" id="btnHide" data-icon="chevron-up" title="收起" aria-label="收起"></button>
      </div>
    </div>
  </div>
</div>

<div class="overlay-layer">
  <div class="bubble" id="bubble" hidden>
    <span class="bubble-name" id="bubbleName"></span>
    <span class="bubble-target" id="bubbleTarget"></span>
  </div>
</div>

<div class="proto-panel" id="protoPanel">
  <div class="proto-head">
    <strong>原型控制台</strong><span>不属于产品界面</span>
    <button class="icon-btn" id="protoHide" data-icon="x" title="隐藏控制台" aria-label="隐藏控制台"></button>
  </div>
  <div class="proto-body">
    <div class="proto-row"><span>主题</span>
      <div class="seg sm" data-control="themePref">
        <button data-value="dark">深</button><button data-value="light">浅</button>
      </div></div>
    <div class="proto-row"><span>停靠边</span>
      <div class="seg sm" data-control="edge" role="group" aria-label="停靠边缘">
        <button data-value="top">上</button><button data-value="bottom">下</button>
        <button data-value="left">左</button><button data-value="right">右</button>
      </div></div>
    <div class="proto-row col"><span>示例查询</span>
      <div class="proto-btns">
        <button data-query="微">微（拼音命中）</button>
        <button data-query="Typora">Typora（系统应用）</button>
        <button data-query="wx">wx（首字母）</button>
        <button data-query="不存在词">空结果</button>
      </div></div>
    <div class="proto-note">规则：已配置项按 名称/拼音/首字母/路径 打分排序；开始菜单应用单独分组标注「未配置」，可点 ＋ 加入 Dock。</div>
  </div>
</div>
<button class="proto-toggle" id="protoToggle" title="显示原型控制台" aria-label="显示原型控制台" hidden>?</button>

<script src="assets/proto.js"></script>
<script>
(function(){
  'use strict';
  const st = {
    themePref:'dark', wall:'auto', style:'glass', label:'icon',
    tileSize:44, radius:18, alpha:.4,
    pinned:false, edge:'top', searchOpen:true, query:'微'
  };
  const items = QA.SEED.map((it, i) => ({...it, id:'i' + i}));
  const els = {
    items:QA.$('#dockItems'), input:QA.$('#searchInput'), count:QA.$('#searchCount'),
    fadeL:QA.$('#fadeLeft'), fadeR:QA.$('#fadeRight'),
    indicator:QA.$('#scrollIndicator'), thumb:QA.$('#scrollThumb'),
    bubble:QA.$('#bubble'), panel:QA.$('#protoPanel'), toggle:QA.$('#protoToggle')
  };
  const fades = {left:els.fadeL, right:els.fadeR, indicator:els.indicator, thumb:els.thumb};

  function installedRows(list){
    const wrap = QA.h('div', {class:'search-installed-list'});
    for(const it of list){
      const tile = QA.h('span', {class:'tile app-icon', 'aria-hidden':'true'});
      tile.append(QA.h('span', {class:'tile-icon', html:QA.svg(it.icon, 32)}));
      wrap.append(QA.h('article', {
        class:'search-installed-item', 'data-installed-id':it.id, tabindex:'0',
        'aria-label':it.name + '，未配置，按 Enter 启动'
      },
        tile,
        QA.h('div', {class:'search-installed-copy'},
          QA.h('strong', {text:it.name, title:it.name}),
          QA.h('span', {text:'开始菜单 · ' + QA.typeLabel(it.type), title:it.target})
        ),
        QA.h('span', {class:'search-installed-status', text:'未配置'}),
        QA.h('button', {
          class:'search-result-add', type:'button',
          title:'添加到 Dock', 'aria-label':'添加 ' + it.name + ' 到 Dock',
          html:QA.svg('plus', 16, 2.2)
        })
      ));
    }
    return wrap;
  }

  function group(title, list, body){
    const sec = QA.h('section', {class:'search-group', 'aria-label':title});
    sec.append(QA.h('div', {class:'search-group-title'},
      QA.h('strong', {text:title}),
      QA.h('span', {class:'search-group-count', text:String(list.length)})
    ));
    sec.append(body);
    return sec;
  }

  function render(){
    const tokens = st.query.trim().length > 0;
    const configured = tokens ? QA.searchItems(items, st.query) : items.slice();
    const installed = tokens ? QA.searchItems(QA.INSTALLED, st.query) : [];
    const frag = document.createDocumentFragment();
    els.items.classList.toggle('searching', true);

    if(!tokens){
      /* 空查询：平铺已配置项 */
      const row = QA.h('div', {class:'search-result-row'});
      for(const it of configured) row.append(QA.tileNode(it, st));
      frag.append(group('已配置', configured, row));
    }else{
      if(configured.length){
        const row = QA.h('div', {class:'search-result-row'});
        for(const it of configured) row.append(QA.tileNode(it, st));
        frag.append(group('已配置', configured, row));
      }
      if(installed.length) frag.append(group('系统应用', installed, installedRows(installed)));
      if(!configured.length && !installed.length){
        frag.append(QA.h('div', {class:'dock-empty', role:'status',
          text:'没有匹配「' + st.query + '」的项目'}));
      }
    }
    els.items.replaceChildren(frag);
    els.count.textContent = tokens
      ? (configured.length + installed.length) + ' 个结果'
      : configured.length + ' / ' + items.length;
    requestAnimationFrame(() => QA.updateScrollChrome(els.items, fades));
  }

  function refresh(){
    QA.applyTokens(st);
    QA.setCollapseBtn(QA.$('#btnHide'), st.edge);
    render();
  }

  QA.attachBubble(QA.$('#dock'), els.items, els.bubble, st, id => items.find(it => it.id === id));

  els.input.addEventListener('input', e => { st.query = e.target.value; render(); });
  els.input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ location.href = '原型-01-主面板.html'; }
    if(e.key === 'Enter' && st.query.trim()){
      const first = $('.tile', els.items) || $('.search-installed-item', els.items);
      if(first) first.click();
    }
  });
  QA.$('#searchClose').addEventListener('click', () => { location.href = '原型-01-主面板.html'; });

  els.items.addEventListener('click', e => {
    const add = e.target.closest('.search-result-add');
    if(add){
      const row = add.closest('.search-installed-item');
      const it = QA.INSTALLED.find(x => x.id === row.dataset.installedId);
      QA.toast('已添加 ' + it.name + ' 到 Dock');
      return;
    }
    const installedRow = e.target.closest('.search-installed-item');
    if(installedRow){
      const it = QA.INSTALLED.find(x => x.id === installedRow.dataset.installedId);
      QA.toast('正在启动：' + it.name);
      return;
    }
    const tile = e.target.closest('.tile');
    if(tile){
      const it = items.find(x => x.id === tile.dataset.id);
      if(it) QA.toast('正在启动：' + it.name);
    }
  });

  QA.$('#btnSearch').addEventListener('click', () => { location.href = '原型-01-主面板.html'; });
  QA.$('#btnMenu').addEventListener('click', () => { location.href = '原型-04-更多操作菜单.html'; });
  QA.$('#btnPin').addEventListener('click', () => {
    st.pinned = !st.pinned;
    QA.$('#btnPin').classList.toggle('active', st.pinned);
    QA.$('#btnPin').setAttribute('aria-pressed', String(st.pinned));
    QA.toast(st.pinned ? '已钉住' : '已取消钉住');
  });
  QA.$('#btnHide').addEventListener('click', () => { location.href = '原型-01-主面板.html'; });

  QA.hydrateIcons();
  QA.bindControls(els.panel, st, key => {
    refresh();
    if(key === 'edge') QA.toast('搜索面板随 Dock 停靠到' + QA.EDGE_LABEL[st.edge] + '边缘');
  });
  QA.$$('[data-query]', els.panel).forEach(b => b.addEventListener('click', () => {
    st.query = b.dataset.query;
    els.input.value = st.query;
    render();
    els.input.focus();
  }));
  QA.wireConsoleHide(els.panel, els.toggle);

  refresh();
  els.input.focus();
  els.input.setSelectionRange(els.input.value.length, els.input.value.length);
})();
</script>
</body>
</html>
