name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore QuickApp.slnx

      - name: 构建
        run: dotnet build QuickApp.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test QuickApp.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
          if-no-files-found: ignore
