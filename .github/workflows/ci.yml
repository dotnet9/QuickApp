name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore QuickApp.slnx

      - name: 构建
        run: dotnet build QuickApp.slnx -c Release --no-restore

      - name: 校验 T4 与单文件原型
        shell: pwsh
        run: |
          pwsh scripts/sync_localization_keys.ps1 -Check
          pwsh scripts/build_prototype.ps1 -Check

      - name: 验证实际界面与更新状态
        shell: pwsh
        run: dotnet run --project scripts/ui-verification/UiVerification.csproj -c Release -- artifacts/ui-verification

      - name: 验证 Windows 原生模态窗口层级
        shell: pwsh
        run: dotnet run --project scripts/ui-verification/UiVerification.csproj -c Release --no-build -- --desktop-modal artifacts/ui-desktop-modal

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 验证离线原型路由
        shell: pwsh
        run: |
          npm ci --prefix design/tests
          npx --prefix design/tests playwright install chromium
          node design/tests/audit-prototype.cjs

      - name: 测试
        run: dotnet test QuickApp.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: 校验安装包名称与哈希门禁
        shell: pwsh
        run: ./scripts/tests/release_installers_test.ps1

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
          if-no-files-found: ignore
