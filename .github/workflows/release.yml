name: release

# 推送 v* 标签即发布：五个平台使用 NativeAOT 并生成原生安装包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 0.2.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 校验 T4 与单文件原型
        shell: pwsh
        run: |
          pwsh scripts/sync_localization_keys.ps1 -Check
          pwsh scripts/build_prototype.ps1 -Check

      - name: 验证实际界面与更新状态
        shell: pwsh
        run: dotnet run --project scripts/ui-verification/UiVerification.csproj -c Release -- artifacts/ui-verification

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 验证离线原型路由
        shell: pwsh
        run: |
          npm ci --prefix design/tests
          npx --prefix design/tests playwright install chromium
          node design/tests/audit-prototype.cjs

      - name: 测试
        run: dotnet test QuickApp.slnx -c Release

  publish:
    name: 发布 ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 NativeAOT 依赖 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 发布
        shell: pwsh
        run: pwsh scripts/publish_quickapp.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION

      - name: 运行本平台 NativeAOT 自检
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $tfm = if ($rid -eq 'win-x64') { 'net10.0-windows' } else { 'net10.0' }
          $name = if ($rid -eq 'win-x64') { 'QuickApp.exe' } else { 'QuickApp' }
          & "./artifacts/publish/$rid/$tfm/QuickApp/$name" --selfcheck
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT 自检失败。' }

      - name: 打包 Linux deb + sha256
        if: startsWith(matrix.rid, 'linux-')
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 打包 macOS dmg + sha256
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: pwsh scripts/package_macos_dmg.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 构建 Windows 安装包
        if: matrix.rid == 'win-x64'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/QuickApp.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\win-x64\net10.0-windows\QuickApp
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $installerName = "QuickApp-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickApp-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: QuickApp-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 验证版本发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          $releaseNotes = ".github/release-notes/v$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Release notes are required: $releaseNotes"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QuickApp v${{ steps.version.outputs.version }}
          body_path: .github/release-notes/v${{ steps.version.outputs.version }}.md
          files: |
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.sha256
            artifacts/release/*.exe
