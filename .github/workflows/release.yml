name: release

# 打 tag（v0.1.0 这类）即自动 AOT 发布并建 GitHub Release；
# 程序里的「检查更新」读的就是这个 Release 的 tag 与 zip 资产。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: AOT 发布并创建 Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 测试
        run: dotnet test QuickApp.slnx -c Release

      - name: AOT 发布（win-x64）
        shell: cmd
        run: scripts\publish.bat win-x64 %APP_VERSION%

      - name: 打包 zip + sha256
        shell: pwsh
        run: pwsh scripts/package_quickapp.ps1 -RuntimeIdentifier win-x64 -Version $env:APP_VERSION -Force

      - name: 上传构建产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: QuickApp-win-x64
          path: artifacts/release/*

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: QuickApp v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
